<?xml version="1.0" encoding="UTF-8"?>
<!-- ZEUS 3.21 requires segmented OS support; the monitor and boot use 8N1. -->
<mameconfig version="10">
    <system name="s8000">
        <input>
            <port tag=":slot_cpu:cpu_a:SEGJP" type="CONFIG" mask="1" defvalue="0" value="1" />
            <port tag=":slot_cpu:cpu_a:DIPSW" type="DIPSWITCH" mask="192" defvalue="64" value="128" />
            <port tag=":slot_cpu:cpu_a:sio0:chb:console:terminal:RS232_DATABITS" type="CONFIG" mask="255" defvalue="3" value="3" />
            <port tag=":slot_cpu:cpu_a:sio0:chb:console:terminal:RS232_PARITY" type="CONFIG" mask="255" defvalue="0" value="0" />
        </input>
    </system>
</mameconfig>
